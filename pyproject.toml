[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.5"]
build-backend = "hatchling.build"

[project]
name = "harald"
dynamic = ["version", "readme"]
description = "helps coding agents work out the bluetooth le and classic protocol of gadgets you own"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "k0nnect" }]
dependencies = [
    "bleak>=3.0",
    "mcp>=2.3",
    "cryptography>=44",
    "pyobjc-framework-IOBluetooth>=11; sys_platform == 'darwin'",
    "dbus-fast>=2; sys_platform == 'linux'",
]

[project.urls]
homepage = "https://github.com/k0nnect/harald"
source = "https://github.com/k0nnect/harald"
issues = "https://github.com/k0nnect/harald/issues"

[project.scripts]
harald = "harald.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "fonttools",
]

[tool.hatch.version]
path = "src/harald/__init__.py"

# pypi shows README.md away from the repo, where its relative image paths find
# nothing, so the long description points them at the files on main instead
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(<img\b[^>]*\bsrc=")assets/'
replacement = '\1https://raw.githubusercontent.com/k0nnect/harald/main/assets/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\()assets/'
replacement = '\1https://raw.githubusercontent.com/k0nnect/harald/main/assets/'

[tool.hatch.build.targets.sdist]
# the demo gif and the tooling that makes it are for the repo page, not the package
exclude = ["/assets/demo.gif", "/tools"]

[tool.hatch.build.targets.wheel]
packages = ["src/harald"]

[tool.hatch.build.targets.wheel.force-include]
"devices" = "harald/devices"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
